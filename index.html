<html lang="vi">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5dce6" />
  <title>Một món quà dành cho bé</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      font-family: 'DM Sans', sans-serif;
      color: #573347;
      background: #f5dce6;
      font-synthesis: none;
      text-rendering: optimizeLegibility
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at center, transparent 45%, #b975921b 100%), radial-gradient(ellipse at 50% 32%, #fffaf9 0, #f8e9ed 52%, #edccd9 100%)
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      opacity: 0;
      animation: sceneIn 1.25s .1s ease-out forwards
    }

    @keyframes sceneIn {
      to {
        opacity: 1
      }
    }

    @keyframes titleIn {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes ctaIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")
    }

    .top {
      position: fixed;
      top: 43px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      animation: titleIn .8s .35s ease-out forwards
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: #a7627c
    }

    .top h1 {
      font: 600 clamp(40px, 5.2vw, 66px)/1.02 'Playfair Display', serif;
      margin: 14px 0 0;
      letter-spacing: -.035em;
      color: #593247
    }

    .top p {
      font-size: 14px;
      color: #795a6b;
      margin: 22px 0 0;
      letter-spacing: .025em
    }

    .focus-dim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(62, 35, 51, .08);
      opacity: 0;
      transition: opacity .45s ease
    }

    .focus-dim.show {
      opacity: 1
    }

    .hint {
      position: fixed;
      bottom: 112px;
      left: 50%;
      right: auto;
      width: max-content;
      max-width: calc(100vw - 28px);
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      color: #60384c;
      pointer-events: none;
      z-index: 5;
      padding: 9px 16px;
      border: 1px solid #fff9;
      border-radius: 999px;
      background: #fffaf2e8;
      box-shadow: 0 6px 22px #71465b24;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translate(-50%, 5px);
      transition: opacity .4s, transform .4s
    }

    .hint.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 38px;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 6;
      padding: 0 18px
    }

    .button {
      display: none;
      border: 1px solid #76556825;
      border-radius: 999px;
      background: #fff9;
      color: #654452;
      padding: 12px 20px;
      font: 600 13px 'DM Sans', sans-serif;
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: .25s
    }

    .button:hover {
      background: #fff;
      transform: translateY(-2px)
    }

    .button.primary {
      background: #ad3f69;
      border-color: #ad3f69;
      color: #fff;
      box-shadow: 0 8px 22px #a4466a35
    }

    .button.primary:hover {
      background: #96365e
    }

    .button:disabled {
      opacity: .45;
      cursor: default;
      transform: none
    }

    .actions.ready #openBtn {
      display: inline-flex;
      animation: ctaIn .6s ease-out both
    }

    .actions.stage-open #wishBtn,
    .actions.blow-complete #wishBtn {
      display: inline-flex
    }

    .actions.card-open #resetBtn {
      display: inline-flex
    }

    .actions.stage-open #openBtn,
    .actions.card-open #wishBtn,
    .actions.card-flying #wishBtn {
      display: none
    }

    .sound-toggle {
      position: fixed;
      top: 24px;
      right: 26px;
      z-index: 5;
      width: 38px;
      height: 38px;
      border: 1px solid #8f5a6a25;
      border-radius: 50%;
      background: #fff9;
      color: #70475d;
      font-size: 15px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px #7c4b5c12;
      backdrop-filter: blur(12px);
      cursor: pointer;
      opacity: 0;
      animation: titleIn .5s 1s ease-out forwards;
      transition: transform .2s, background .2s
    }

    .sound-toggle:hover {
      transform: scale(1.06);
      background: #fff
    }

    .photo-caption {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: 158px;
      transform: translate(-50%, 8px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 17px;
      border: 1px solid #ffffffa6;
      border-radius: 999px;
      background: #fffaf2d9;
      color: #70475d;
      font-size: 13px;
      box-shadow: 0 8px 28px #78445624;
      transition: .25s;
      white-space: nowrap
    }

    .photo-caption.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .toast {
      position: fixed;
      top: 25px;
      right: 25px;
      padding: 12px 16px;
      border: 1px solid #ffffff2b;
      background: #241a2dcc;
      border-radius: 14px;
      font-size: 12px;
      color: #f9e5d7;
      z-index: 4;
      opacity: 0;
      transform: translateY(-8px);
      transition: .25s;
      pointer-events: none
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0)
    }

    .footer {
      position: fixed;
      right: 20px;
      bottom: 18px;
      font-size: 10px;
      color: #8066769c;
      letter-spacing: .08em;
      pointer-events: none
    }

    @media(max-width:650px) {
      .top {
        top: max(16px, env(safe-area-inset-top));
        padding: 0 14px
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: .3em
      }

      .top h1 {
        font-size: clamp(34px, 9.5vw, 48px);
        margin-top: 9px
      }

      .top p {
        font-size: 12px;
        line-height: 1.45;
        margin-top: 10px
      }

      .hint {
        bottom: calc(72px + env(safe-area-inset-bottom));
        padding: 8px 14px;
        font-size: 11.5px;
        line-height: 1.4
      }

      .actions {
        bottom: calc(13px + env(safe-area-inset-bottom));
        padding: 0 10px;
        gap: 7px;
        flex-wrap: nowrap
      }

      .button {
        padding: 10px 14px;
        min-height: 40px;
        font-size: 12px;
        white-space: nowrap
      }

      .sound-toggle {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 36px;
        height: 36px
      }

      .footer {
        display: none
      }

      .photo-caption {
        bottom: calc(112px + env(safe-area-inset-bottom));
        max-width: calc(100vw - 28px);
        padding: 9px 13px;
        font-size: 12px;
        white-space: normal;
        text-align: center
      }
    }

    @media(max-width:390px) {
      .actions {
        gap: 5px;
        padding: 0 7px
      }

      .button {
        padding: 9px 11px;
        font-size: 11px
      }

      .top h1 {
        font-size: clamp(32px, 9vw, 38px)
      }
    }

    @media(max-height:560px) and (orientation:landscape) {
      .top {
        top: 8px
      }

      .eyebrow {
        font-size: 7px
      }

      .top h1 {
        font-size: 32px;
        margin-top: 4px
      }

      .top p {
        font-size: 11px;
        margin-top: 4px
      }

      .hint {
        bottom: 58px;
        font-size: 11px
      }

      .actions {
        bottom: 8px
      }

      .photo-caption {
        bottom: 83px
      }

      .sound-toggle {
        top: 8px;
        right: 10px;
        width: 32px;
        height: 32px
      }
    }
  </style>
